workflow: jira-sprint
source: jira
runtime: opencode
provider: rehor-openai
model: gpt-6.1-sol
envs:
  - node
  - go
  - patternfly-mcp
  - slack
  - container-scan
# Sandbox image launched by the agent dispatcher for this profile.
image:
  repository: quay.io/redhat-services-prod/hcc-platex-services/fleetshift-bot-instance
  # Newest promoted Konflux build of main.
  tag: latest
# Declarative preflights (REHOR-231): the complete set for this instance,
# executed by the dispatcher's TS engine (@rehor/preflights) instead of
# scripts pulled from this repository. Replaces the workflow default set.
preflights:
  - gh-pr-status
  - gl-mr-status
  - id: jira-sprint
    with:
      label: ome-ai-bot
      include_backlog: true
      email: platform-experience-services@redhat.com
# Non-secret sandbox runtime selection forwarded by the dispatcher.
preflight:
  env:
    BOT_EXECUTION_ENGINE: coordinator
    BOT_CONFIG_PATH: instance/fleetshift-config
    BOT_INSTANCE_ID: 'Bořivoj Lodník z Plovoucího hradu'
    BOT_LABEL: ome-ai-bot
    # Board has no sprints; collect non-sprint tickets like the in-cluster
    # deployment did.
    BOT_INCLUDE_BACKLOG: 'true'
